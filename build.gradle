plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'io.freefair.lombok' version '8.6'
    id 'com.github.node-gradle.node' version '7.1.0'
}

def buildDay = java.time.LocalDate.now(java.time.ZoneId.systemDefault())
def buildDate = buildDay.format(java.time.format.DateTimeFormatter.ofPattern("yyMMdd"))
def buildVersion = buildDay.monthValue == 6 && buildDay.dayOfMonth == 4
        ? "890604-Tiananmen-Massacre-Special-Version"
        : "${buildDate}-SNAPSHOT"

version = buildVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def syncModVersion = tasks.register("syncModVersion") {
    inputs.property("buildVersion", buildVersion)
    outputs.files(
            layout.projectDirectory.file("gradle.properties"),
            layout.projectDirectory.file("src/main/resources/fabric.mod.json"),
            layout.projectDirectory.file("src/main/java/cn/omix/Client.java")
    )

    doLast {
        def propertiesFile = layout.projectDirectory.file("gradle.properties").asFile
        def propertiesContent = propertiesFile.getText("UTF-8")
        def updatedProperties = propertiesContent.replaceFirst(
                /(?m)^mod_version=.*$/,
                "mod_version=${buildVersion}"
        )

        if (updatedProperties != propertiesContent) {
            propertiesFile.setText(updatedProperties, "UTF-8")
        }

        def metadataFile = layout.projectDirectory.file("src/main/resources/fabric.mod.json").asFile
        def metadataContent = metadataFile.getText("UTF-8")
        def updatedMetadata = metadataContent.replaceFirst(
                /(?m)^(\s*"version"\s*:\s*")[^"]*(".*)$/,
                '$1' + buildVersion + '$2'
        )

        if (updatedMetadata != metadataContent) {
            metadataFile.setText(updatedMetadata, "UTF-8")
        }

        def clientFile = layout.projectDirectory.file("src/main/java/cn/omix/Client.java").asFile
        def clientContent = clientFile.getText("UTF-8")
        def updatedClient = clientContent.replaceFirst(
                /(?m)^(\s*public static String version\s*=\s*")[^"]*("\s*;.*)$/,
                '$1' + buildVersion + '$2'
        )

        if (updatedClient != clientContent) {
            clientFile.setText(updatedClient, "UTF-8")
        }
    }
}

tasks.withType(Jar).configureEach {
    dependsOn syncModVersion
}


repositories {
    maven {
        name = "CCBlueX Releases"
        url = uri("https://maven.ccbluex.net/releases")
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "net.ccbluex:mcef:3.3.0-1.21.11"
    include "net.ccbluex:mcef:3.3.0-1.21.11"

    // MCEF declares OkHttp as a runtime dependency. Loom's include configuration is
    // deliberately non-transitive, so these must be nested explicitly for production
    // launchers (the IntelliJ runtime classpath otherwise hides the missing dependency).
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    include "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okio:okio-jvm:3.6.0"
    include "com.squareup.okio:okio-jvm:3.6.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    include "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
    include "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"
    include "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"

    implementation "io.netty:netty-codec-http:4.2.7.Final"
    implementation "io.netty:netty-handler-proxy:4.2.7.Final"
    include "io.netty:netty-handler-proxy:4.2.7.Final"
    implementation "io.netty:netty-codec-socks:4.2.7.Final"
    include "io.netty:netty-codec-socks:4.2.7.Final"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

node {
    version = "22.14.0"
    download = true
    nodeProjectDir = file("src-webui")
}

def buildWebUi = tasks.register("buildWebUi", com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named("npmInstall")
    args = ["run", "build"]
    inputs.files(
            "src-webui/package.json",
            "src-webui/package-lock.json",
            "src-webui/index.html",
            "src-webui/svelte.config.js",
            "src-webui/tsconfig.json",
            "src-webui/vite.config.ts"
    )
    inputs.dir("src-webui/src")
    outputs.dir("src-webui/dist")
}

def bundleWebUi = tasks.register("bundleWebUi", Zip) {
    dependsOn buildWebUi
    from("src-webui/dist")
    archiveFileName = "webui.zip"
    destinationDirectory = layout.buildDirectory.dir("generated/webui")
}

processResources {
    dependsOn syncModVersion
    dependsOn bundleWebUi

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    from(bundleWebUi.flatMap { it.archiveFile }) {
        into "assets/omix/webui"
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    dependsOn syncModVersion

    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def verifyWebUiRuntimeBundle = tasks.register("verifyWebUiRuntimeBundle") {
    dependsOn tasks.named("remapJar")
    inputs.file(tasks.named("remapJar").flatMap { it.archiveFile })

    doLast {
        def requiredNestedJars = [
                "mcef-3.3.0-1.21.11.jar",
                "okhttp-4.12.0.jar",
                "okio-jvm-3.6.0.jar",
                "kotlin-stdlib-1.9.10.jar",
                "kotlin-stdlib-jdk7-1.9.10.jar",
                "kotlin-stdlib-jdk8-1.9.10.jar"
        ]
        def archive = tasks.named("remapJar").get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def missing = requiredNestedJars.findAll {
                zip.getEntry("META-INF/jars/${it}") == null
            }
            if (!missing.isEmpty()) {
                throw new GradleException("WebUI runtime dependencies missing from ${archive.name}: ${missing}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("check") {
    dependsOn verifyWebUiRuntimeBundle
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
