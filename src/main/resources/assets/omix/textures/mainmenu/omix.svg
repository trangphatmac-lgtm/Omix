<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="bright" x1="34" y1="25" x2="128" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#75E6A3"/>
      <stop offset="0.52" stop-color="#35D47B"/>
      <stop offset="1" stop-color="#20B967"/>
    </linearGradient>
    <linearGradient id="deep" x1="24" y1="130" x2="128" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#119251"/>
      <stop offset="0.55" stop-color="#1CAF61"/>
      <stop offset="1" stop-color="#2BCB72"/>
    </linearGradient>
    <linearGradient id="fold" x1="101" y1="55" x2="128" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10884A" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#10884A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#04130B" flood-opacity="0.28"/>
    </filter>
    <mask id="ring">
      <rect width="160" height="160" fill="#000"/>
      <circle cx="80" cy="80" r="61" fill="#fff"/>
      <circle cx="80" cy="80" r="27" fill="#000"/>
    </mask>
  </defs>

  <!--
    Omix primary mark.
    Geometry: 160 × 160 canvas, 61 px outer radius, 27 px counter.
    The two curved fields form an O while their opposing flow represents “mix”.
  -->
  <g filter="url(#soft-shadow)" mask="url(#ring)">
    <rect width="160" height="160" fill="url(#deep)"/>
    <path
      d="M0 0H160V39
         C133 38 118 49 112 65
         C105 83 94 94 77 100
         C55 108 40 125 36 160
         H0Z"
      fill="url(#bright)"/>

    <!-- Controlled overlap at the two hand-off points gives the mark depth. -->
    <path
      d="M112 64
         C121 61 132 63 143 70
         V104
         C133 93 124 85 112 81
         C106 79 102 78 98 78
         C104 74 109 69 112 64Z"
      fill="url(#fold)"/>
    <path
      d="M48 96
         C39 99 28 97 17 90
         V56
         C27 67 36 75 48 79
         C54 81 58 82 62 82
         C56 86 51 91 48 96Z"
      fill="#8AF0B0"
      opacity="0.24"/>
  </g>
</svg>
